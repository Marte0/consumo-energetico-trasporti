<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consumo energetico dei trasporti secondo il vettore energetico, 2000–2025." />
    <title>Consumo energetico dei trasporti</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  </head>
  <body>
    <svg width="0" height="0" class="svg-definitions" aria-hidden="true">
      <filter id="svg-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="-3" dy="3" stdDeviation="0" flood-color="rgba(0,0,0,1)" />
      </filter>
    </svg>
    <header class="page-header">
      <h1>Consumo dei trasporti secondo il vettore energetico nel tempo</h1>
      <a href="https://www.bfs.admin.ch/bfs/it/home/statistiche/cataloghi-banche-dati.assetdetail.36777266.html" target="_blank" rel="noopener noreferrer">
        Fonte: Ufficio federale di statistica ↗
      </a>
    </header>
    <main id="container">
      <div id="donut-chart" aria-live="polite"></div>
      <div id="year-slider-container">
        <input type="range" id="year-slider" min="2000" max="2025" value="2000" step="1" aria-label="Anno" />
        <span id="year-label">2000</span>
      </div>
      <div id="energy-icons" aria-label="Vettori energetici"></div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
